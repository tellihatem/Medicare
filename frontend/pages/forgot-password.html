<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Medicare - Reset your password">
    <title>Medicare - Forgot Password</title>
    
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/auth.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="auth-page">
        <div class="auth-container" style="width: 100%; max-width: 100%;">
            <!-- Mobile header -->
            <header class="auth-header">
                <div class="auth-logo">
                    <div class="auth-logo-icon">
                        <i data-lucide="heart-pulse"></i>
                    </div>
                    <span class="auth-logo-text">Medicare</span>
                </div>
            </header>

            <!-- Forgot password card -->
            <div class="auth-card fade-in">
                <div class="forgot-illustration">
                    <i data-lucide="key-round"></i>
                </div>
                
                <div class="auth-card-header">
                    <h1 class="auth-card-title">Forgot Password?</h1>
                    <p class="auth-card-subtitle">
                        No worries! Enter your email and we'll send you a reset link.
                    </p>
                </div>

                <div class="auth-card-body">
                    <form id="forgotPasswordForm" class="auth-form" novalidate>
                        <div class="form-group">
                            <label for="email" class="form-label required">Email Address</label>
                            <div class="input-wrapper">
                                <span class="input-icon">
                                    <i data-lucide="mail"></i>
                                </span>
                                <input 
                                    type="email" 
                                    id="email" 
                                    name="email"
                                    class="form-input" 
                                    placeholder="Enter your email"
                                    autocomplete="email"
                                    required
                                >
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-full btn-lg auth-submit">
                            <i data-lucide="send"></i>
                            <span>Send Reset Link</span>
                        </button>
                    </form>
                </div>

                <p class="auth-footer">
                    Remember your password? 
                    <a href="login.html" class="auth-footer-link">Back to Login</a>
                </p>
            </div>
        </div>
    </div>

    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
